<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F1F5F9" />
    <title>أنت غير متصل | كتاب بكتاب</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(15 23 42 / 8%);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #e2e8f0;
        color: #334155;
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 12px 0 0; color: #475569; font-size: 14px; line-height: 1.8; }
      button {
        margin-top: 24px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #1e293b;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.5A15 15 0 0 1 22 7M5 12a10 10 0 0 1 12-1.5M8.5 15.5a5 5 0 0 1 5-1" />
          <path d="m3 3 18 18" />
          <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تقدر ترجع لهذه الصفحة بدون اتصال. تصفح الكتب والمبادلة والنقاط تحتاج اتصالاً بالإنترنت.</p>
      <button type="button" onclick="window.location.reload()">حاول مرة أخرى</button>
    </main>
  </body>
</html>
